services:
  - type: web
    name: midlex-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WORKSPACE_JWT_SECRET
        sync: false
      - key: WORKSPACE_DEVELOPER_EMAIL
        value: joshuaomatsuli01@gmail.com
      - key: WORKSPACE_DEVELOPER_NAME
        value: Joshua Omatsuli (Developer)
      - key: WORKSPACE_DEVELOPER_PASSWORD
        sync: false
      - key: WORKSPACE_PROJECT_LEGAL_ADMIN_SECRET
        sync: false
      - key: WORKSPACE_PROJECT_LEGAL_STAFF_SECRET
        sync: false
      - key: WORKSPACE_PROJECT_FINANCE_SECRET
        sync: false
      - key: WORKSPACE_PROJECT_CBT_SECRET
        sync: false
      - key: WORKSPACE_PROJECT_MIP_SECRET
        sync: false
      - key: WORKSPACE_PROJECT_HRMS_SECRET
        sync: false
      - key: WORKSPACE_PROJECT_ANALYTICS_SECRET
        sync: false
      - key: WORKSPACE_PROJECT_MEDIA_SECRET
        sync: false
      - key: WORKSPACE_PROJECT_REALTY_SECRET
        sync: false
      - key: WORKSPACE_PROJECT_AI_SECRET
        sync: false
      - key: WORKSPACE_URL
        value: https://developer.midlex.xyz
      - key: WORKSPACE_PROJECT_HRMS_ADMIN_URL
        value: https://admin.hrms.midlex.xyz
      - key: WORKSPACE_PROJECT_HRMS_USER_URL
        value: https://hrms.midlex.xyz
      - key: WORKSPACE_PROJECT_CBT_ADMIN_URL
        value: https://midlex-cbt-admin.vercel.app
      - key: WORKSPACE_PROJECT_CBT_USER_URL
        value: https://midlex-cbt.vercel.app
      - key: WORKSPACE_PROJECT_AI_ADMIN_URL
        value: https://admin.ai.midlex.xyz
      - key: WORKSPACE_PROJECT_AI_USER_URL
        value: https://ai.midlex.xyz
      - key: WORKSPACE_PROJECT_REALTY_ADMIN_URL
        value: https://admin.reality.midlex.xyz
      - key: WORKSPACE_PROJECT_REALTY_USER_URL
        value: https://reality.midlex.xyz
